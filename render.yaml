services:
  # The Node.js Backend API
  - type: web
    name: ai-ats-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-ats-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DB_SYNC_FORCE
        value: "false"
      - key: DB_SYNC_ALTER
        value: "true" # Safely alters tables if models change
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure secret!
      
      # The following variables will be prompted for in the Render Dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  # The PostgreSQL Database
  - name: ai-ats-db
    databaseName: ats_production
    user: ats_user
    plan: free
